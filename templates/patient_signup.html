<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Smart Healthcare Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a2b4a,#2563eb);padding:20px 0;}
.auth-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.auth-logo{text-align:center;margin-bottom:24px;}
.auth-logo .icon{font-size:3rem;margin-bottom:8px;}
.auth-logo h1{font-size:1.4rem;color:#1a2b4a;font-weight:800;}
.auth-logo p{color:#6b7280;font-size:.9rem;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-weight:600;font-size:.88rem;color:#374151;margin-bottom:5px;}
.form-group input{width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:.93rem;outline:none;transition:border .2s;}
.form-group input:focus{border-color:#2563eb;}
.auth-btn{width:100%;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:6px;transition:background .2s;}
.auth-btn:hover{background:#15803d;}
.error-box{background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.88rem;}
.auth-links{text-align:center;margin-top:14px;font-size:.88rem;color:#6b7280;}
.auth-links a{color:#2563eb;text-decoration:none;font-weight:600;}
.strength-bar{height:5px;border-radius:3px;background:#e5e7eb;margin-top:5px;}
.strength-fill{height:100%;border-radius:3px;transition:all .3s;width:0%;}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">🏥</div>
      <h1>Create Your Account</h1>
      <p>Smart Healthcare Assistant — Free forever</p>
    </div>

    {% if error %}
    <div class="error-box">❌ {{ error }}</div>
    {% endif %}

    <form method="POST" onsubmit="return validateSignup()">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" placeholder="e.g. Ravi Kumar" required>
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" name="phone" placeholder="10-digit mobile number" maxlength="10" required>
      </div>
      <div class="form-group">
        <label>Password * (min 6 characters)</label>
        <input type="password" name="password" id="pwd" placeholder="Create a strong password" required oninput="checkStrength(this.value)">
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" name="confirm_password" id="cpwd" placeholder="Repeat your password" required>
        <div id="matchMsg" style="font-size:.8rem;margin-top:3px;"></div>
      </div>
      <button type="submit" class="auth-btn">✅ Create Account</button>
    </form>

    <div class="auth-links" style="margin-top:14px;">
      Already have an account?
      <a href="{{ url_for('patient_login') }}">Login here</a>
    </div>
  </div>
</div>

<script>
function checkStrength(pwd) {
  let score = 0;
  if (pwd.length >= 6)  score++;
  if (pwd.length >= 10) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
  const widths  = ['20%','40%','60%','80%','100%'];
  const fill = document.getElementById('strengthFill');
  fill.style.width      = widths[Math.min(score-1,4)] || '0%';
  fill.style.background = colors[Math.min(score-1,4)] || '#ef4444';
}
document.getElementById('cpwd').addEventListener('input', function() {
  const msg = document.getElementById('matchMsg');
  if (this.value === document.getElementById('pwd').value) {
    msg.textContent = '✅ Passwords match';
    msg.style.color = '#16a34a';
  } else {
    msg.textContent = '❌ Passwords do not match';
    msg.style.color = '#ef4444';
  }
});
function validateSignup() {
  const pwd  = document.getElementById('pwd').value;
  const cpwd = document.getElementById('cpwd').value;
  if (pwd !== cpwd) { alert('Passwords do not match!'); return false; }
  if (pwd.length < 6) { alert('Password must be at least 6 characters!'); return false; }
  return true;
}
</script>
</body>
</html>
